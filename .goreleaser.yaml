# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ai

builds:
  - id: ai
    main: ./cmd/ai
    binary: ai
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/lassejlv/ai-cli/internal/cli.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ai
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: lassejlv
    name: ai-cli
  prerelease: auto
  footer: |
    Install by downloading the archive for your platform below, or with Go:

    ```bash
    go install github.com/lassejlv/ai-cli/cmd/ai@{{ .Tag }}
    ```

    Verify downloads against `checksums.txt`.
